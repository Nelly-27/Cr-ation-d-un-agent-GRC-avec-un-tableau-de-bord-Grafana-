# Chaîne complète : Sources → Agent IA → PostgreSQL → Grafana → MCP → Chatbot Next.js
# Démarrage :  cp .env.example .env  &&  docker compose up -d --build
name: grc-grafana

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-grc}
  POSTGRES_READER_USER: ${POSTGRES_READER_USER:-grc_reader}
  POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-change-me-reader}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_USER:-grc_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Agent Python : collecte au démarrage puis toutes les COLLECT_INTERVAL_SECONDS (1 h par défaut)
  agent:
    build: ./agent
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre un Ollama installé sur la machine
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      <<: *db-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-admin}
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/veille-grc.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Consultation sans connexion, en lecture seule (rôle Viewer). Le compte admin reste
      # nécessaire pour administrer. Mettez GRAFANA_ANONYMOUS=false dans .env pour l'exiger partout.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      retries: 30

  # Crée le compte Grafana « Viewer » (lecture seule) du serveur MCP, puis s'arrête
  grafana-init:
    image: python:3.12-slim
    command: ["python", "/init/create_mcp_user.py"]
    environment:
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-admin}
      GRAFANA_MCP_USER: ${GRAFANA_MCP_USER:-mcp-reader}
      GRAFANA_MCP_PASSWORD: ${GRAFANA_MCP_PASSWORD:-change-me-mcp}
    volumes:
      - ./grafana/init:/init:ro
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"

  # Serveur MCP officiel de Grafana, en lecture seule :
  #  - compte Grafana Viewer (aucune modification possible côté Grafana) ;
  #  - --disable-write retire les outils d'écriture ;
  #  - query_sql est réactivé (--enable-query) car la source PostgreSQL utilise un compte en lecture seule.
  mcp-grafana:
    image: grafana/mcp-grafana:2.2.0
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - mcp-grafana:8000,localhost:8000,localhost:${MCP_PORT:-8000},127.0.0.1:${MCP_PORT:-8000}
      - --disable-write
      - --enable-query
      - --enabled-tools
      - search,datasource,dashboard,folder,navigation,sql
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: ${GRAFANA_MCP_USER:-mcp-reader}
      GRAFANA_PASSWORD: ${GRAFANA_MCP_PASSWORD:-change-me-mcp}
    ports:
      - "${MCP_PORT:-8000}:8000"
    depends_on:
      grafana-init:
        condition: service_completed_successfully

  chatbot:
    build: ./chatbot
    env_file: .env
    environment:
      MCP_GRAFANA_URL: http://mcp-grafana:8000/mcp
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-3300}
      DATABASE_URL: postgresql://${POSTGRES_READER_USER:-grc_reader}:${POSTGRES_READER_PASSWORD:-change-me-reader}@postgres:5432/${POSTGRES_DB:-grc}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CHATBOT_PORT:-3100}:3000"
    depends_on:
      - mcp-grafana

volumes:
  pgdata:
  grafanadata:
